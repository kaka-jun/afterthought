<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afterthought</title>
  <style>
    :root {
      --bg-primary: #faf9f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f5f4f2;
      --text-primary: #2d2d2d;
      --text-secondary: #6b6b6b;
      --text-muted: #999999;
      --border-color: #e8e6e3;
      --accent: #8b7355;
      --accent-light: #c4b5a0;
      --timeline-line: #d4d0c8;
      --tag-book: #7a9e7e;
      --tag-podcast: #9e7a7a;
      --shadow: rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #252525;
      --bg-tertiary: #2d2d2d;
      --text-primary: #e8e6e3;
      --text-secondary: #a8a8a8;
      --text-muted: #6b6b6b;
      --border-color: #3a3a3a;
      --accent: #c4b5a0;
      --accent-light: #8b7355;
      --timeline-line: #4a4a4a;
      --tag-book: #5a7e5e;
      --tag-podcast: #7e5a5a;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 60px 0 40px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .controls {
      padding: 24px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .theme-toggle {
      padding: 8px 12px;
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
      transition: color 0.2s;
    }

    .theme-toggle:hover {
      color: var(--accent);
    }

    .timeline {
      padding: 40px 0;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--timeline-line);
    }

    .year-marker {
      position: relative;
      padding-left: 50px;
      margin-bottom: 30px;
    }

    .year-marker::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 8px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
    }

    .year-marker h2 {
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .entry {
      position: relative;
      padding-left: 50px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .entry::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 10px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 2px solid var(--timeline-line);
      transition: all 0.2s;
    }

    .entry:hover::before {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .entry-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .entry:hover .entry-card {
      border-color: var(--accent-light);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .entry-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .entry-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .entry-author {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .entry-type {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .entry-type.book {
      background: var(--tag-book);
      color: white;
    }

    .entry-type.podcast {
      background: var(--tag-podcast);
      color: white;
    }

    .entry-rating {
      font-size: 0.85rem;
      color: var(--accent);
    }

    .entry-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .entry-preview {
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .entry-full {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .entry-full.show {
      display: block;
    }

    .entry-full p {
      font-size: 0.9rem;
      color: var(--text-primary);
      margin-bottom: 12px;
      text-align: justify;
    }

    .collapse-btn {
      display: block;
      margin-top: 12px;
      padding: 6px 0;
      border: none;
      background: none;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .year-summary {
      position: relative;
      padding-left: 50px;
      margin-bottom: 30px;
    }

    .year-summary-card {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border: 1px solid var(--accent-light);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .year-summary-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 500;
    }

    .year-summary-section {
      margin-bottom: 20px;
    }

    .year-summary-section:last-child {
      margin-bottom: 0;
    }

    .year-summary-section h4 {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .year-summary-section p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .no-results {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
    }

    .stats {
      text-align: center;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
    }

    footer {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .api-input-group {
        flex-direction: column;
      }

      .timeline::before {
        left: 12px;
      }

      .year-marker {
        padding-left: 36px;
      }

      .year-marker::before {
        left: 6px;
      }

      .entry {
        padding-left: 36px;
      }

      .entry::before {
        left: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AFTERTHOUGHT</h1>
      <p>A personal timeline of reflections</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search titles, authors, or content...">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="book">Book</button>
        <button class="filter-btn" data-filter="podcast">Podcast</button>
      </div>
      <div class="filter-group">
        <select id="ratingFilter" class="filter-btn" style="padding-right: 8px;">
          <option value="all">All Ratings</option>
          <option value="8">8+</option>
          <option value="7">7+</option>
        </select>
        <select id="tagFilter" class="filter-btn" style="padding-right: 8px;">
          <option value="all">All Tags</option>
        </select>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span id="themeIcon">&#9790;</span>
      </button>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="stats" id="stats"></div>

    <footer>
      Afterthought &middot; A space for quiet reflection
    </footer>
  </div>

        tags: ["推理", "家庭伦理", "日本社会", "老龄化"],
        review: `这本书其实前两周就看完了，但是读后感是拖到今天才写。为什么最近突然想看东野圭吾的书？主要还是因为这位著名的推理小说作家在近期去世了，我也很想通过阅读他的其它我没读过的作品来瞻仰和缅怀这位作家。不过我也不得不承认，最近读的这两本的确是和他最出名的几部比如解忧杂货店、白夜行、嫌疑人X的现身、恶意等差距实在是太大太大了。不论是多么伟大的艺术创作者，他/她的作品集里总会混杂一些不尽如人意的几部。我想，那我作为普通人，也不需要对自己平时的工作表现要求太高了。

这本书到最后的反转感觉和秘密有点像，都是主角身边的亲人和自己因为种种原因很难相处下去，只能选择善意的欺骗和谎言，把自己变成另外一个人。这本书让人心碎的地方在于老奶奶的亲儿子为了拯救自己那不成器的儿子不让他坐牢，竟然选择编织谎言把杀人的罪名推卸到自己以为已经完全老年痴呆的老母亲身上，殊不知老母亲一直以来都在为了不引起家庭矛盾而装疯卖傻。整个粉饰作案的手法其实也非常简单直接，很容易就被警察看穿。书中让人觉得温情暖暖的另一条线是警察加贺与自己父亲和解的过程，尊重父亲选择自己独自一人去世而为母亲去世时自己不在身边而赎罪，但是加贺却通过远程下棋的方式，默默陪伴在父亲身边，这样的剧情反转让人觉得又温暖又遗憾。整本书主要是以日本人口老龄化的社会问题，从而折射出家庭伦理矛盾，在这样的社会背景下引发了一个惨案。很现实，很让人难过。如果国家不能帮助家庭解决老年人养老问题，这样的惨剧还是会不断上演。`
      },
      {
        title: "秘密",
        author: "东野圭吾",
        type: "book",
        date: "2026-09-06",
        rating: 6,
        tags: ["推理", "家庭", "女性", "日本社会"],
        review: `一周前开始看这本书，当时看三分之一，感觉故事进展实在太慢，一度都要看不下去了，一直充斥着各种不人物的对话和新线索，然而在推荐故事发展上却并没有起到什么关键性的作用，仿佛感觉作者是在为了凑字数而写。我是万万没想到这本书在封面标榜自己还是很畅销的一部作品，比如说很快在日本国内就卖了两百万册。这个长周末决定看完这本书。我一目十行地扫过全书，感觉整本书的唯一亮点就在书最后1/10的位置才出现。因车祸去世的妻子直子的意识一直都在占据着女儿的身体，从来没有去世过，但是为了让活着的丈夫和自己能好好告别，不得不假装女儿的意识回来了，以此来让丈夫和自己都能走向不同的人生。这本书男性凝视的部分还是有不少，一度让人感觉看的有些不适，尤其是书中几次三番提到占据着女儿身体的妻子意识主动提出解决丈夫的性问题，丈夫因为想到对方还是女儿的身体，几次拒绝，但读起来还是很恶心的。书中的丈夫的同事也会主动提到带丈夫去红灯区潇洒解决生理问题，在妻子去世后没几个月就想给对方介绍对象，真是让人觉得唏嘘。这个世界还是以男性为主导，女性生存还是很艰难，即便妻子以女儿的身体回到现实世界，依然要承受每天做饭的责任，丈夫虽然身份是父亲，也不收拾家务，这些劳动依然被默认为是女性的职责所在，无论这个女性的身份在家中是什么样的。但让人比较有鼓舞的还是直子这个人的性格吧，她非常有自己的想法，在被上天给予了第二次重生的机会后，她要好好地活过，闯出自己的一番天地。`
      },
      {
        title: "一日三秋",
        author: "刘震云",
        type: "book",
        date: "2026-07-12",
        rating: 8,
        tags: ["魔幻现实主义", "人民生活", "女性", "社会"],
        review: `这本书前半部分感觉神神叨叨的，第一次看刘震云把一些中式鬼魂情节加到这种朴实的人民小说中。前半部分主要是写李延生，一个曾在延津唱白蛇戏饰演许仙的人，有一天突然被一起搭戏饰演白娘子但后来婚后不幸福选择上吊自尽的的樱桃缠上了身，跨越千里来到武汉帮助她找到她的前夫，她因此附身在了儿子陈明亮留存在身边自己的照片里。但樱桃的照片被陈明亮后妈发现，还被偷偷拿去给巫婆用钉子钉住从而被诅咒，后来虽然又被明亮救回但又不小心失手掉进长江里，最后随着长江流到了宋朝，被宋朝人所救。整本书经常提到延津的一个神仙花二娘，她总是在人的睡梦中跑到人梦里让人给她讲笑话，如果讲的不好笑就会让人背着她去吃胡辣汤，然后被大山压死，如果讲的好笑就会给人一个红柿子以作奖励。整本书读起来很魔幻，书中的中式志怪情节仿佛对于书中人物来说就是稀松平常的一件事。我找Claude确认了，这是刘震云对于魔幻现实主义的比较典型的一次尝试。但我确实也没有读懂加入的花二娘的情节有何意味。

除了志怪的情节以外，整本书还是延续了刘震云以往的风格，主要就是写朴实无华的人民生活。他对人的观察实在是太细致入微了，人和人之间私密的对话，那些人和人之间发生的尴尬、不齿甚至犯法的事情就这么三言两语不经意间被他写出来，比如明亮老婆马小萌在结婚前跟明亮吐露心声说自己以前长期受到继父的性骚扰，明亮以为这就是她经历过的最黑暗的往事了，谁知道后来有人把她曾经在北京打工其实是当鸡的往事曝光了出来，让她彻底在延津社死，明亮感叹以为大家在结婚前都已经互相交底了，以为大家结婚的基础就是在于能够互相吐露心声，没想到却还有这么一段转折。而且后来两个人逃离延津来到西安，一开始两人在菜市场卖菜想要开始新生活，结果马小萌被老乡发现这段往事还差点被强奸，人性的恶在这里暴露无遗。这几段故事读起来实在是太真实了，让人感觉好像这就在眼前发生的一样，让我像旁观者一样就站在角色旁边听着他们每一句对话，看着他们每一个动作。我心里深深为马小萌感到愤愤不平，同时也知道那个年代因为女性总是依附于男性生活，女性在被压迫时真的很难获取到真正的援助。幸亏到故事的最后明亮和马小萌的生活还是好起来了，两个人共同努力在西安开了好几家卖猪蹄的分店。

为什么我这么喜欢刘震云的作品？他从不会写优美华丽的文字，但他总是用最简单的三言两语描述给读者一个真实的老百姓生活，让人看到平凡中的坚韧。明亮在叔叔李延生家寄宿了十年之久，后来因为亲生父亲没法继续给他提供生活费了，只能自己选择高中辍学，到当地卖猪蹄的一家店当学徒，也是因为此他才学到了一门手艺，给他之后在西安打下了基础。人生就是这样充满着转折，今天以为的低谷，谁知道是不是塞翁失马焉知非福，相信人的韧性总是能帮助人走出阴霾。`
      },
      {
        title: "我不是潘金莲",

这本书是虚构了一个十五岁日本小男生本田润一的日常故事，他刚步入青春期，遭遇父亲离世，身边的亲人主要是妈妈和舅舅。书里写了几个简单的生活故事，主要都是润一对生活的体验和观察，书中穿插着舅舅给润一写的信，主题也都是讨论润一的想法。书里展现了一个比较立体的润一：爱思考，善良，大度，同时也很胆小和怯懦。虽然是个青少年视角的书，但书里传达的道理却质朴又给人力量。

      timeline.innerHTML = html;

      const bookCount = filtered.filter(i => i.type === 'book').length;
      const podcastCount = filtered.filter(i => i.type === 'podcast').length;
      document.getElementById('stats').textContent = `${filtered.length} entries | ${bookCount} books | ${podcastCount} podcasts`;
    }

    function toggleEntry(id) {
      const el = document.getElementById(id);
      el.classList.toggle('show');
    }

    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('themeIcon');
      if (body.dataset.theme === 'dark') {
        body.dataset.theme = '';
        icon.innerHTML = '&#9790;';
        localStorage.setItem('theme', 'light');
      } else {
        body.dataset.theme = 'dark';
        icon.innerHTML = '&#9788;';
        localStorage.setItem('theme', 'dark');
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.dataset.theme = 'dark';
        document.getElementById('themeIcon').innerHTML = '&#9788;';
      }
    }

    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTimeline();
      });
    });

    document.getElementById('ratingFilter').addEventListener('change', (e) => {
      currentRatingFilter = e.target.value;
      renderTimeline();
    });

    document.getElementById('tagFilter').addEventListener('change', (e) => {
      currentTagFilter = e.target.value;
      renderTimeline();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTimeline();
    });

    initTheme();
    initTagFilter();
    renderTimeline();
  </script>
</body>
</html>
